version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    ignore:
      # Must match the minimum engines.vscode, so it moves only with that.
      - dependency-name: "@types/vscode"
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
